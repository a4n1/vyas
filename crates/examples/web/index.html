<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vyas</title>
    <link rel="icon" href="/favicon.ico?v=matching-noto-serif-v" />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #000;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
      }

      #loader {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        background: #000;
        color: #fff;
        font: 16px/1.4 monospace;
        z-index: 1;
        transition:
          opacity 400ms ease,
          visibility 0s 400ms;
      }

      #loader.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="vyas"></canvas>
    <div id="loader">Loading...</div>

    <script type="module">
      import init from "./pkg/examples.js";

      if (!navigator.gpu || !(await navigator.gpu.requestAdapter())) {
        throw new Error("This example requires a browser with WebGPU enabled.");
      }

      await init();
    </script>
  </body>
</html>
