<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vyas</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #000;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
      }
    </style>
  </head>
  <body>
    <canvas id="vyas"></canvas>
    <script type="module">
      import init from "./pkg/examples.js";

      if (!navigator.gpu || !(await navigator.gpu.requestAdapter())) {
        throw new Error("This example requires a browser with WebGPU enabled.");
      }

      await init();
    </script>
  </body>
</html>
