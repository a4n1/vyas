[package]
name = "vyas"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Agni <a@a4n1.com>"]
description = "A voxel engine"
repository = "https://github.com/a4n1/vyas"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
egui = ["dep:egui", "dep:egui-winit", "dep:egui-wgpu"]

[dependencies]
bytemuck.workspace = true
egui = { workspace = true, optional = true }
egui-winit = { workspace = true, optional = true }
egui-wgpu = { workspace = true, optional = true }
env_logger.workspace = true
glam.workspace = true
log.workspace = true
lru.workspace = true
pollster.workspace = true
rand.workspace = true
serde.workspace = true
vox-rs.workspace = true
web-time.workspace = true
wgpu.workspace = true
winit.workspace = true

[dev-dependencies]
criterion = "0.8"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_log.workspace = true
console_error_panic_hook.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies.wgpu]
workspace = true
features = ["webgl"]

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5.2"
objc2-app-kit = { version = "0.2.2", features = ["NSApplication", "NSMenu", "NSMenuItem"] }
objc2-foundation = { version = "0.2.2", features = ["NSProcessInfo", "NSString"] }
